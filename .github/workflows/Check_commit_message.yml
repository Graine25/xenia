name: Commit Message Check

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Optional base ref/SHA to validate from'
        required: false
        type: string
      head:
        description: 'Optional head ref/SHA to validate to'
        required: false
        type: string
  workflow_call:
    inputs:
      base:
        description: 'Optional base ref/SHA to validate from'
        required: false
        default: ''
        type: string
      head:
        description: 'Optional head ref/SHA to validate to'
        required: false
        default: ''
        type: string

jobs:
  commit-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          INPUT_BASE: ${{ inputs.base }}
          INPUT_HEAD: ${{ inputs.head }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ -n "${INPUT_BASE}" ]; then
            BASE="${INPUT_BASE}"
            HEAD="${INPUT_HEAD:-${GITHUB_SHA}}"
          else
            echo "Commit message validation only applies to pull requests unless a base ref/SHA is provided."
            exit 0
          fi

          COMMITS=$(git log --format="%H %s" "${BASE}..${HEAD}" --)

          if [ -z "${COMMITS}" ]; then
            echo "No commits found in this PR."
            exit 0
          fi

          FAILED=0
          while IFS= read -r LINE; do
            SHA="${LINE%% *}"
            MSG="${LINE#* }"
            SHORT="${SHA::7}"

            if echo "${MSG}" | grep -qP '^\[.+?\]'; then
              echo "✅ ${SHORT}: ${MSG}"
            else
              echo "❌ ${SHORT}: ${MSG}"
              echo "::error::Commit ${SHORT} is missing a [Tag] prefix. Expected format: [Tag] Description (e.g. [CPU] Fix overflow in JIT)"
              FAILED=1
            fi
          done <<< "${COMMITS}"

          echo ""

          if [ "${FAILED}" -eq 1 ]; then
            echo "::error::One or more commits are missing a [Tag] prefix."
            echo ""
            echo "Expected format:  [Tag] Description"
            echo "Examples:         [CPU] <commit message>"
            echo "                  [GPU] <commit message>"
            echo "                  [UI] <commit message>"
            echo "                  [CI] <commit message>"
            exit 1
          fi

          echo "All commit messages have a valid [Tag] prefix."
