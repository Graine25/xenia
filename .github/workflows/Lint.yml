name: Lint

on:
  workflow_dispatch:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    outputs:
      #LLVM_VERSION: ${{ steps.setup.outputs.LLVM_VERSION }}
      UBUNTU_BASE: ${{ steps.setup.outputs.UBUNTU_BASE }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup
        id: setup
        env:
          LLVM_VERSION: 20
        run: |
          UBUNTU_BASE=$(lsb_release -cs)
          #echo "LLVM_VERSION=$LLVM_VERSION" >> "$GITHUB_OUTPUT"
          echo "UBUNTU_BASE=$UBUNTU_BASE" >> "$GITHUB_OUTPUT"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-$LLVM_VERSION main"
          sudo apt-get -y update
          sudo apt-get -y install clang-format-$LLVM_VERSION
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-$LLVM_VERSION 200
      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD"
          fi

          set +e
          python3 third_party/clang-format/git-clang-format \
            --binary=clang-format \
            --commit="${BASE}" \
            --style=file \
            --diff > .clang-format.diff
          RESULT=$?
          set -e

          if grep -q "no modified files\|did not modify" .clang-format.diff; then
            cat .clang-format.diff
            exit 0
          fi

          cat .clang-format.diff
          echo "::error::clang-format reported changes. Run 'xb format' before pushing."
          exit 1

